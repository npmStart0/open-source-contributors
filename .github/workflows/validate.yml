name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only: PRs from forks never receive write or deployment credentials.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate contributors
        run: npm run validate:contributors

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
